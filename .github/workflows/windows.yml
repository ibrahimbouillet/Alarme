name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release --parallel
      - name: Test deterministic core behavior
        run: ctest --preset windows-release -R '^(alarm_engine|elapsed_cycle|widget_state)$' --no-tests=error
      # Hosted runners cannot establish physical audio, wake or interactive desktop behavior.
      - name: Prepare downloadable package
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -SkipBuild -SkipTests
      - name: Prepare graphical Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath out/releases -Filter 'ALARM-*-windows-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one ALARM release ZIP.' }
          $payload = Join-Path $env:RUNNER_TEMP ('alarm-installer-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $payload
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 is missing from the hosted Windows runner.' }
          & ./scripts/package-installer.ps1 -PayloadDirectory $payload -OutputDirectory out/releases -IsccPath $iscc
      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath out/releases -Filter 'ALARM-*-windows-x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one ALARM installer.' }
          & ./scripts/test-installer.ps1 -InstallerPath $installers[0].FullName -ExpectedExecutable build/ALARM.exe -OutputDirectory .local/installer-validation
      # Private setup logs contain local paths and are not uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: ALARM-windows-x64
          path: |
            out/releases/*.zip
            out/releases/*-setup.exe
            out/releases/*.sha256
          if-no-files-found: error
